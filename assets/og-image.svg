<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative particles -->
  <circle cx="150" cy="150" r="3" fill="#22d3ee" opacity="0.6"/>
  <circle cx="250" cy="100" r="2" fill="#a855f7" opacity="0.5"/>
  <circle cx="950" cy="180" r="4" fill="#f43f5e" opacity="0.5"/>
  <circle cx="1050" cy="120" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="200" cy="450" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="1000" cy="480" r="3" fill="#f43f5e" opacity="0.5"/>
  <circle cx="120" cy="350" r="2" fill="#22d3ee" opacity="0.4"/>
  <circle cx="1080" cy="350" r="2" fill="#a855f7" opacity="0.4"/>

  <!-- Name -->
  <text x="80" y="180" font-family="Space Grotesk, sans-serif" font-size="72" font-weight="700" fill="#f1f5f9" letter-spacing="-0.02em">Kartik</text>
  <text x="80" y="250" font-family="Space Grotesk, sans-serif" font-size="72" font-weight="700" fill="url(#accent)" letter-spacing="-0.02em">Padmanabhan</text>

  <!-- Title -->
  <text x="80" y="330" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" fill="#22d3ee" letter-spacing="0.05em">Data Science Undergraduate</text>

  <!-- Description -->
  <text x="80" y="390" font-family="Inter, sans-serif" font-size="24" fill="#94a3b8" font-weight="400">Explainable ML · Churn Analytics · Real-time Computer Vision</text>

  <!-- Stats -->
  <text x="80" y="460" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" fill="#f1f5f9">ROC-AUC 0.912</text>
  <text x="320" y="460" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" fill="#f1f5f9">PR-AUC 0.787</text>
  <text x="560" y="460" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" fill="#f1f5f9">MAE 10.6</text>

  <!-- URL -->
  <text x="80" y="560" font-family="JetBrains Mono, monospace" font-size="20" font-weight="500" fill="#64748b">kartik-git95.github.io</text>

  <!-- Accent line -->
  <line x1="80" y1="520" x2="300" y2="520" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
</svg>